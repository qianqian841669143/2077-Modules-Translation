# CP2077 UI Translator 运行配置
#
# verbose = 0   只写启动那几行（默认，几乎零开销）
# verbose = 1   另外记录前 120 条替换明细，排查漏翻时用
# verbose = 2   再每 500 次记一行累计
#
# 改完重启游戏生效。日志在 <游戏>\red4ext\logs\cp2077uitranslator-*.log
verbose=0

# stat = 1  每 5 秒往日志写一行频率统计（经过 hook 的调用数 / 文本调用数），
#           排查性能问题时临时打开。默认关 —— 开着会往最热路径里加一次原子自增。
stat=0
